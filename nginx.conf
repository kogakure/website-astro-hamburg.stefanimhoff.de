server {
	listen 80;
	listen [::]:80;
	server_name localhost;
	root /usr/share/nginx/html;
	index index.html;
	absolute_redirect off;

	# Security headers apply to successful responses, error pages, and child locations.
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

	location / {
		try_files $uri $uri/ =404;
	}

	location = /sitemap.xml {
		return 301 /sitemap-index.xml;
	}

	location = /manifest.webmanifest {
		types {
			application/manifest+json webmanifest;
		}
		try_files $uri =404;
	}

	# Astro-generated filenames are content-addressed and safe to retain indefinitely.
	location ^~ /_astro/ {
		try_files $uri =404;

		# Defining add_header here stops inheritance, so repeat the security set.
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	# Workbox emits its runtime with a content hash at the site root.
	location ~ ^/workbox-[0-9a-f]+\.js$ {
		try_files $uri =404;

		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	# Public assets keep stable URLs, so revalidate them on a bounded schedule.
	location ~* \.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
		try_files $uri =404;

		# Defining add_header here stops inheritance, so repeat the security set.
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header Cache-Control "public, max-age=86400, must-revalidate" always;
	}

	# Error 404
	error_page 404 /404.html;

	# Special handling for /sw.js
	location = /sw.js {
		# Defining add_header here stops inheritance, so repeat the security set.
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate" always;
	}
}
