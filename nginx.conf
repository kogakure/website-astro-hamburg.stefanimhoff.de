server {
	listen 80;
	listen [::]:80;
	server_name localhost;
	root /usr/share/nginx/html;
	index index.html;

	# Security headers apply to successful responses, error pages, and child locations.
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

	location / {
		try_files $uri $uri/ =404;
	}

	location = /sitemap.xml {
		return 301 /sitemap-index.xml;
	}

	# Error 404
	error_page 404 /404.html;

	# Special handling for /sw.js
	location = /sw.js {
		# Defining add_header here stops inheritance, so repeat the security set.
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate" always;
	}
}
